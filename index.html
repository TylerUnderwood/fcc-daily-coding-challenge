<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCC - Daily Coding Challenge</title>
    <link href="./styles/index.css" rel="stylesheet">
    <script src="./scripts/DCC/index.js"></script>
    <script src="./scripts/DCC/Tools/parseDailyQuestion.js"></script>
    <script src="./scripts/index.js"></script>
</head>
<body>
    <header class="Section Header">
        <div class="Section__wrap flex">
            <div class="flex-fill"></div>
            <a
                id="todaysChallenge"
                class="Link"
                href="https://www.freecodecamp.dev/learn/daily-coding-challenge/"
                target="_blank"
                rel="noopener noreferrer"
            >
                Todays Challenge &#x1F86D;
            </a>
        </div>
    </header>
    <main class="Main">
        <div class="Section Hero">
            <div class="Section__wrap">
                <h1 class="Title">Daily Coding Challenge</h1>
                <ul>
                    <li>Use your own IDE.</li>
                    <li>Use your browser's console to test your code.</li>
                    <li>Store solutions in the repo.</li>
                </ul>
            </div>
        </div>
        <section
            id="section-challengerSetup"
            class="Section"
            aria-labelledby="heading-challengerSetup"
        >
            <div class="Section__wrap">
                <h2 id="heading-challengerSetup">
                    Challenger Setup
                </h2>
                <form id="challengerSetupForm" class="Form mt-2">
                    <label for="userSelect" class="Label">
                        Who is testing today?
                    </label>
                    <br/>
                    <input list="userNamesDataList" id="userSelect" name="userSelect" class="Field" />
                    <span class="js__showCurrentUser"></span>
                    <br/><br/>
                    <label for="dateSelect" class="Label">
                        What day are we testing?
                    </label>
                    <br/>
                    <input type="date" id="dateSelect" name="dateSelect" class="Field" />
                    <span class="js__showCurrentDate"></span>
                    <br/><br/>
                    <label for="resetDateToggle">
                        <input id="resetDateToggle" type="checkbox">
                        <span class="Label">Reset the date on a new day</span>
                    </label>
                    <br/><br/>
                    <button type="submit">
                        Load
                    </button>
                    <button type="reset" label="Clear Local Storage">
                        Clear
                    </button>
                </form>
            </div>
        </section>
        <section
            id="section-parseDailyQuestion"
            class="Section mt-4"
            style="display: none;"
            aria-labelledby="heading-parseDailyQuestion"
        >
            <div class="Section__wrap">
                <h2 id="heading-parseDailyQuestion">
                    Parse Daily Question
                </h2>
                <form id="parseDailyQuestionForm" class="Form mt-2">
                    <textarea id="dailyQuestion" class="Field mt-2" placeholder="Paste the daily question here..."></textarea>
                    <button id="parseDailyQuestion" class="mt-1" type="submit">GO</button>
                    <div class="mt-2">
                        <span id="parseDailyQuestionMessage" class="FormMessage"></span>
                    </div>
                </form>
            </div>
        </section>
    </main>
    <footer class="Section Footer">
        <div class="Section__wrap">
            <span>&#x1F517; Challenger's Github</span>
            <ul id="challengersGithubList"></ul>
        </div>
    </footer>

    <!-- DATALISTs -->
    <datalist id="userNamesDataList">
        <option value="TylerUnderwood"></option>
        <option value="BoltenBeeper"></option>
    </datalist>
</body>
</html>
